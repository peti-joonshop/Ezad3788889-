# Copy to /etc/nginx/sites-available/tablojadoo.conf and replace the domain.
# Obtain SSL with certbot after DNS points to this VPS.
server {
    listen 80;
    listen [::]:80;
    server_name tablojadoo.ir www.tablojadoo.ir;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tablojadoo.ir www.tablojadoo.ir;

    ssl_certificate /etc/letsencrypt/live/tablojadoo.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tablojadoo.ir/privkey.pem;

    client_max_body_size 50m;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
